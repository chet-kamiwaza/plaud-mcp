name: Codacy Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '18 21 * * 4'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # GitHub SARIF-only: do not pass CODACY_PROJECT_TOKEN here. With a project
      # token, the CLI loads tool settings from codacy.com; Trivy enabled there
      # with zero patterns triggers "Failed to configure Codacy Trivy: no patterns
      # configured". Fix in Codacy UI (Code patterns → Trivy) if you need token
      # sync with the dashboard, then you may re-add project-token.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
          allow-network: true

      # Codacy CLI emits a single SARIF with multiple `runs[]` (one per
      # underlying tool: Trivy, Bandit, etc.). GitHub Code Scanning rejects
      # multi-run SARIFs sharing one category. Give each run a distinct
      # `automationDetails.id` so CodeQL treats them as separate categories,
      # which is what the 2025-07-21 changelog requires.
      - name: Tag SARIF runs with per-tool category
        run: |
          set -euo pipefail
          if [ ! -s results.sarif ]; then
            echo "no results.sarif produced; creating empty SARIF"
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > results.sarif
            exit 0
          fi
          jq '
            .runs |= (to_entries | map(
              .value.automationDetails.id =
                "codacy-cli/" +
                ((.value.tool.driver.name // "unknown")
                  | ascii_downcase
                  | gsub("[^a-z0-9]+"; "-")
                  | sub("^-"; "") | sub("-$"; "")
                ) + "/" + (.key | tostring) + "/"
            ) | map(.value))
          ' results.sarif > results.tagged.sarif
          mv results.tagged.sarif results.sarif
          echo "Runs and their categories:"
          jq -r '.runs[] | .automationDetails.id' results.sarif

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
