services:
  plaud-mcp:
    build:
      context: .
    image: ghcr.io/chet-kamiwaza/plaud-mcp:latest
    container_name: plaud-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Legacy static token mode (uncomment to use):
      # - PLAUD_TOKEN=${PLAUD_TOKEN}

      # Auto-refresh mode (recommended for password users):
      - PLAUD_EMAIL=${PLAUD_EMAIL}
      - PLAUD_PASSWORD=${PLAUD_PASSWORD}
      - PLAUD_AUTO_REFRESH=${PLAUD_AUTO_REFRESH:-false}

      # Token file (required for auto-refresh; also used for SSO setup):
      - PLAUD_TOKEN_FILE=${PLAUD_TOKEN_FILE:-/app/data/plaud.token}

      - PLAUD_DEVICE_ID=${PLAUD_DEVICE_ID}
      - MCP_TRANSPORT=http
    volumes:
      - plaud-data:/app/data

volumes:
  plaud-data:
