# deploy/secret.yaml - TEMPLATE - DO NOT COMMIT WITH REAL VALUES
#
# Security: T-03-03 - This file is a template with placeholder values.
# Add deploy/secret.yaml to .gitignore before inserting real credentials.
#
# How to populate real values:
#   echo -n "your-plaud-token-here" | base64
#   echo -n "your-device-uuid-here" | base64
#
# Token location on macOS:
#   ~/Library/Application Support/Plaud/config.json  (electron-store)
#
# Apply:
#   1. Fill in real base64 values below
#   2. kubectl apply -f deploy/secret.yaml
#   3. Do NOT commit the populated file to git
apiVersion: v1
kind: Secret
metadata:
  name: plaud-credentials
type: Opaque
data:
  # Replace with: echo -n "your-actual-token" | base64
  PLAUD_TOKEN: "REPLACE_WITH_BASE64_ENCODED_TOKEN"
  # Replace with: echo -n "your-actual-device-uuid" | base64
  PLAUD_DEVICE_ID: "REPLACE_WITH_BASE64_ENCODED_DEVICE_ID"
