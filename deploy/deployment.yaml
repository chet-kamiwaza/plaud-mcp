# deploy/deployment.yaml
# Plaud MCP Server - Kubernetes Deployment
#
# Runs the server in HTTP transport mode (MCP_TRANSPORT=http).
# Credentials are injected from the plaud-credentials Secret - see secret.yaml.
#
# Apply:  kubectl apply -f deploy/
# Delete: kubectl delete -f deploy/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plaud-mcp
  namespace: plaud-mcp
  labels:
    app: plaud-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plaud-mcp
  template:
    metadata:
      labels:
        app: plaud-mcp
    spec:
      # Security: T-03-02 - run as non-root UID 1000 (matches Dockerfile USER)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: false
      containers:
        - name: plaud-mcp
          # Replace the tag with a pinned version and ideally a sha256 digest
          # (e.g. plaud-mcp:0.1.0@sha256:<digest>) before deploying to prod.
          image: plaud-mcp:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MCP_TRANSPORT
              value: "http"
          # Credentials injected from K8s Secret - never baked into image (T-03-01)
          envFrom:
            - secretRef:
                name: plaud-credentials
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Liveness probe: CONT-05
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: plaud-mcp
  namespace: plaud-mcp
spec:
  podSelector:
    matchLabels:
      app: plaud-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming HTTP from within the cluster only (ClusterIP Service).
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Outbound HTTPS to Plaud's API.
    - ports:
        - protocol: TCP
          port: 443
